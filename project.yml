name: MyIPhoneApp
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  MyIPhoneApp:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: AppInfo.plist
      properties:
        UIFileSharingEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myiphoneapp
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: 通勤
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        MARKETING_VERSION: '1.1.0'
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  MyIPhoneApp:
    build:
      targets:
        MyIPhoneApp: all
