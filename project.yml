name: MyIPhoneApp
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  MyIPhoneApp:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: AppInfo.plist
      properties:
        CFBundleDisplayName: LongWay
        UIFileSharingEnabled: true
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: 用于在你发起通勤后识别出发和到达，并在切到高德导航期间记录本次行程。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myiphoneapp
        GENERATE_INFOPLIST_FILE: 'YES'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        MARKETING_VERSION: '1.5.1'
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  MyIPhoneApp:
    build:
      targets:
        MyIPhoneApp: all
